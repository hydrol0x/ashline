<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  [hidden] { display: none !important; }
  :root { --bg: #FAF7F2; --card: #FFFFFF; --ink: #2A2826; --muted: #7C766D; --line: #E8E1D6; --accent: #1F6F6B; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  .top { position: sticky; top: 0; z-index: 5; background: rgba(250, 247, 242, .96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .top div { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .back { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; padding: 6px 2px; white-space: nowrap; }
  .top h1 { flex: 1; font-size: 15px; font-weight: 600; margin: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dl { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; background: var(--accent); color: #fff;
        text-decoration: none; font-size: 14px; font-weight: 600; white-space: nowrap; border: 1px solid var(--accent); }
  .dl.quiet { background: var(--card); color: var(--ink); border-color: var(--line); }
  main { max-width: 1120px; margin: 0 auto; padding: 16px 16px 110px; }
  .summary { display: flex; flex-wrap: wrap; gap: 10px 26px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .summary div { font-size: 12.5px; color: var(--muted); }
  .summary b { display: block; font-size: 20px; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
  .notice { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .notice a { color: var(--accent); }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(250, 247, 242, .96); backdrop-filter: blur(6px);
            border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bottom div { max-width: 1120px; margin: 0 auto; display: flex; gap: 10px; }
  .bottom .dl { flex: 1; justify-content: center; padding: 12px; }
  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 28px 18px; text-align: center; color: var(--muted); }
  .note { color: var(--muted); font-size: 11.5px; margin: 22px 0 0; text-align: center; }
  @media (max-width: 520px) { .top .dl { display: none; } }
</style>
