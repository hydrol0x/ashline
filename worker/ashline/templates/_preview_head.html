<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/static/img/favicon.png">
<link rel="stylesheet" href="/static/brand.css">
<style>
  .top { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--rule); }
  .top div { max-width: 1160px; margin: 0 auto; padding: 12px 18px; display: flex; align-items: center; gap: 12px; }
  .back { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 15px; padding: 6px 0; white-space: nowrap; }
  .top h1 { flex: 1; font-size: 16px; font-weight: 700; margin: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dl { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 3px; background: var(--ink); color: #fff;
        text-decoration: none; font-size: 15px; font-weight: 600; white-space: nowrap; border: 1.5px solid var(--ink); }
  .dl.quiet { background: #fff; color: var(--ink); border-color: var(--rule); }
  main { max-width: 1160px; margin: 0 auto; padding: 22px 18px 120px; }
  .summary { display: flex; flex-wrap: wrap; gap: 14px 40px; border-top: 2px solid var(--ink); padding: 16px 0 6px; margin-bottom: 10px; }
  .summary div { font-size: 14px; color: var(--muted); }
  .summary b { display: block; font: 700 30px/1.1 var(--sans); color: var(--ink); letter-spacing: -0.02em; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .notice { font-size: 15px; color: var(--ink-2); margin: 0 0 20px; }
  .notice a { text-decoration-color: var(--red); text-decoration-thickness: 2px; text-underline-offset: 3px; font-weight: 600; }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--rule); padding: 10px 18px calc(10px + env(safe-area-inset-bottom)); }
  .bottom div { max-width: 1160px; margin: 0 auto; display: flex; gap: 10px; }
  .bottom .dl { flex: 1; padding: 13px; }
  .empty { background: var(--panel); padding: 30px 20px; color: var(--ink-2); }
  .note { color: var(--muted); font-size: 12.5px; margin: 26px 0 0; }
  @media (max-width: 520px) { .top .dl { display: none; } }
</style>
