[project]
name = "ashline"
version = "0.1.0"
description = "Ashline worker: home twin seed (Matterport + Vexcel) and case tools"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pillow>=10",
    "shapely>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "reportlab>=4.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
agent = ["deepagents>=0.7", "langchain-anthropic>=1.0", "langchain-openai>=0.3"]
claude = ["anthropic>=1.0"]
photon = ["photonhq-api>=0.6"]
heic = ["pillow-heif>=0.16"]
local-vision = ["torch>=2.2", "transformers>=5.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ashline = "ashline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ashline*"]

[tool.setuptools.package-data]
ashline = ["templates/*.html", "static/pdfjs/*", "static/fonts/*", "static/img/*", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
