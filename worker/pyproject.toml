[project]
name = "ashline"
version = "0.1.0"
description = "Ashline worker: home twin seed (Matterport + Vexcel) and case tools"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pillow>=10",
    "shapely>=2.0",
]

[project.optional-dependencies]
agent = ["deepagents>=0.7", "langchain-anthropic>=1.0", "langchain-openai>=0.3"]
claude = ["anthropic>=1.0"]
local-vision = ["torch>=2.2", "transformers>=5.0"]
dev = ["pytest>=8"]

[project.scripts]
ashline = "ashline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ashline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
